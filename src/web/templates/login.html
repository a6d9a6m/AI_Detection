<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频异常检测系统 - 登录</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/static/main.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <svg width="60" height="60" viewBox="0 0 60 60">
                        <circle cx="30" cy="30" r="28" fill="#1e88e5" opacity="0.1"/>
                        <path d="M20 25 Q30 15, 40 25 T40 35" stroke="#1e88e5" stroke-width="3" fill="none"/>
                        <circle cx="20" cy="25" r="2" fill="#1e88e5"/>
                        <circle cx="30" cy="20" r="2" fill="#1e88e5"/>
                        <circle cx="40" cy="25" r="2" fill="#1e88e5"/>
                    </svg>
                </div>
                <h1>音频异常检测系统</h1>
                <p>Audio Anomaly Detection System</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="remember"> 记住登录状态
                    </label>
                </div>

                <button type="submit" class="btn-primary">登录</button>

                <div class="form-footer">
                    <p>默认账号: admin / admin123</p>
                </div>
            </form>

            <div id="error-message" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 登录成功，跳转到主页
                    window.location.href = '/dashboard';
                } else {
                    // 显示错误消息
                    errorMessage.textContent = data.error || '登录失败，请检查用户名和密码';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = '网络错误，请稍后重试';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
